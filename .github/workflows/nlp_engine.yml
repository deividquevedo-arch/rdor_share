name: nlp_engine

on:
  push:
    paths:
      - "plataform/nlp_engine/**"
      - ".github/workflows/nlp_engine.yml"
  pull_request:
    paths:
      - "plataform/nlp_engine/**"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plataform/nlp_engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (dev inclui spacy — alinhado ao venv local)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest tests -q
