specialty_id: hepatologia
config_version: 0.1.12-hep-llm-prompt-clin
nlp:
  shared_organs_path: ../shared/organs.yaml
  target_organs:
  - figado
  - vesicula_biliar
  - vias_biliares
  organs:
    figado:
      regex:
      - \bhepat\w*
    vesicula_biliar:
      seeds:
      - vesicula biliar
      - vesícula biliar
      - vesicula
      - vesícula
      - colecisto
    vias_biliares:
      seeds:
      - vias biliares
      - via biliar
      - coledoco
      - colédoco
      - hepatocoledoco
  segmentation:
    mode: auto
    force_full_doc_for: []
  findings:
    lesao_focal:
    - nodulo hipervascular
    - lirads 4
    - lirads 5
    esteatose:
    - degeneracao gordurosa figado
    - degeneração gordurosa figado
    - figado com ecogenicidade aumentada
    colecao_hepatica:
    - infarto figado
    hepatomegalia:
    - hipertrofia lobo caudado
    dilatacao_biliar:
    - dilatacao vias-biliares
    - dilatação vias-biliares
    hepatopatia:
    - baco aumentado
    - cavernoma porta
    - circulacao colateral
    - circulação colateral
    - cirrose
    - congestao passiva cronica figado
    - congestão passiva crônica figado
    - contorno irregular
    - doenca alcoolica figado
    - doença alcoólica figado
    - doenca hepatica
    - doença hepática
    - encefalopatia hepatica
    - encefalopatia hepática
    - esclerose hepatica
    - esclerose hepática
    - fibrose
    - fibrose esclerose alcoolicas
    - figado gorduroso alcoolico
    - figado gorduroso alcoólico
    - hepatite
    - hipertensao portal
    - hipertensão portal
    - hepatopatia cronica
    - hepatopatia crônica
    - hiperplasia nodular regenerativa
    - hiperpasia nodular regenerativa
    - lobulado
    - sindrome obstrucao sinusoidal hepatica
    - síndrome obstrução sinusoidal hepática
    - trombose veia porta
    - varizes esofagianas
    - varizes gastricas
    - varizes gástricas
    - veia porta dilatada
    - insuficiencia hepatica
    - insuficiência hepática
  findings_regex:
    hepatopatia:
    - \bhiperplasia\s+nodular\s+regenerativa\b
    - \bhiperpasia\s+nodular\s+regenerativa\b
  negation_phrases:
  - ausencia
  - nao ha
  - não há
  - sem
  - ausencia de
  - ausência de
  negation_window: 3
  finding_organ_max_chars: 220
  score_policy_version: v1_bins_legacy
  use_spacy_matcher: true
  feature_flags:
    calibrated_hybrid: true
  embeddings:
    use_embeddings: true
    decision_mode: hybrid
    embedding_backend: auto
    embedding_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    similarity_threshold: 0.78
    ambiguity_band:
    - 0.3
    - 0.7
    hybrid_weight_rule: 0.7
    hybrid_weight_semantic: 0.3
    similarity_threshold_by_model:
      pucpr/biobertpt-all:
        similarity_threshold: 0.88
        ambiguity_band:
        - 0.35
        - 0.65
  text_pipeline:
    trailing_line_patterns:
    - (?i)^\s*este\s+laudo\s+pode\s+nao\s+estar\s+completo.*webris.*$
  llm_router:
    mode: llm
    provider: openai_compatible
    model: databricks-claude-haiku-4-5
    uncertainty_band:
    - 0.35
    - 0.65
    fallback_policy: keep_current
    max_input_chars: 8000
    json_response_format: false
    prompt_system: >-
      Voce e um assistente de triagem clinica em hepatologia. Responda APENAS com
      um unico objeto JSON, sem texto adicional. Esquema: {"relevante": boolean}.
    specialty_context: >-
      Tarefa: decidir se o laudo de imagem deve ser ENCAMINHADO para avaliacao em
      hepatologia. Responda relevante=true SOMENTE quando houver doenca ou alteracao
      hepatica que justifique acompanhamento, por exemplo: esteatose hepatica;
      cirrose ou sinais de hepatopatia cronica; hipertensao portal; fibrose hepatica;
      lesao focal suspeita ou indeterminada (ex.: nodulo hepatico, LI-RADS 4 ou 5);
      dilatacao das vias biliares. Responda relevante=false quando o figado e as vias
      biliares estiverem NORMAIS, quando houver apenas achados BENIGNOS tipicos
      (ex.: cisto hepatico simples, hemangioma tipico), quando houver apenas
      alteracoes INESPECIFICAS, ou quando o achado for negado/ausente. Na duvida
      entre benigno e relevante, prefira relevante=false, EXCETO esteatose, que e
      sempre relevante.
    prompt_user_template: "Contexto:\n{specialty_context}\n\nExcerto:\n{text}"
data: {}
monitoring: {}
