specialty_id: hepatologia
config_version: 0.1.9-diamond-pack2b-antifp-v1-pr2-reverted-pr1-only
nlp:
  shared_organs_path: ../shared/organs.yaml
  target_organs:
  - figado
  - vesicula_biliar
  - vias_biliares
  organs:
    figado:
      regex:
      - \bhepat\w*
    vesicula_biliar:
      seeds:
      - vesicula biliar
      - vesícula biliar
      - vesicula
      - vesícula
      - colecisto
    vias_biliares:
      seeds:
      - vias biliares
      - via biliar
      - coledoco
      - colédoco
      - hepatocoledoco
  segmentation:
    mode: auto
    force_full_doc_for: []
  findings:
    lesao_focal:
